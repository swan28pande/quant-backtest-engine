[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt"
version = "0.1.0"
description = "Backtesting engine: Python research API over a C++ event-driven execution core"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[tool.setuptools]
packages = ["qbt"]
